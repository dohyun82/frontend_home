<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>frontend_home · 웹 테스트</title>
  <link rel="stylesheet" href="assets/base.css" />
</head>
<body>
  <header class="page-head">
    <div class="inner">
      <h1>웹 테스트</h1>
      <p>모바일 브라우저에서 확인하는 웹 동작 테스트 모음</p>
    </div>
  </header>

  <main class="wrap">

    <section class="card">
      <h2>현재 환경</h2>
      <table class="kv">
        <tr><th>브라우저</th><td id="e_browser">-</td></tr>
        <tr><th>플랫폼</th><td id="e_platform">-</td></tr>
        <tr><th>User-Agent</th><td id="e_ua">-</td></tr>
      </table>
    </section>

    <h2 style="margin:28px 0 0;font-size:15px">테스트 목록</h2>

    <a class="test-item" href="tests/onelink-deeplink/">
      <div class="top">
        <span class="badge dim">TEST 01</span>
        <span class="badge ok">삼성 인터넷</span>
      </div>
      <h3>식권대장 OneLink 딥링크</h3>
      <p>AppsFlyer OneLink로 식권대장 앱 OAuth 화면 진입. 앱 미설치 시 스토어 이동 확인.</p>
      <div class="meta">vendys.onelink.me/szhg → sikdae://screen/main/oauth</div>
    </a>

    <section class="card" style="margin-top:28px">
      <h2>보관</h2>
      <p class="desc">이전 프로젝트 파일입니다.</p>
      <a class="btn sm" href="archive/ladder-shift.html">시차 출근제 / 사다리타기 (archive)</a>
    </section>

    <footer class="page-foot">frontend_home</footer>
  </main>

  <script>
  (function () {
    'use strict';
    var ua = navigator.userAgent;
    var browser = '알 수 없음';
    var isSamsung = /SamsungBrowser/i.test(ua);
    if (isSamsung) {
      var m = ua.match(/SamsungBrowser\/([\d.]+)/);
      browser = '삼성 인터넷 ' + (m ? m[1] : '');
    } else if (/FBAN|FBAV|Instagram|KAKAOTALK|NAVER|Line\//i.test(ua)) { browser = '인앱 브라우저'; }
    else if (/EdgA?\//i.test(ua)) { browser = 'Edge'; }
    else if (/CriOS|Chrome/i.test(ua)) { browser = 'Chrome'; }
    else if (/Firefox|FxiOS/i.test(ua)) { browser = 'Firefox'; }
    else if (/Safari/i.test(ua)) { browser = 'Safari'; }

    var platform = /Android/i.test(ua) ? 'Android'
      : /iPhone|iPad|iPod/i.test(ua) ? 'iOS'
      : /Windows/i.test(ua) ? 'Windows'
      : /Mac OS X/i.test(ua) ? 'macOS' : '기타';

    document.getElementById('e_browser').innerHTML = browser +
      (isSamsung ? ' <span class="badge ok">삼성 인터넷</span>' : '');
    document.getElementById('e_platform').textContent = platform;
    document.getElementById('e_ua').textContent = ua;
  })();
  </script>
</body>
</html>
